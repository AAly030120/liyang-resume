<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <circle cx="120" cy="75" r="42" fill="#ffffff" opacity="0.08"/>
  <circle cx="690" cy="80" r="30" fill="#ffffff" opacity="0.10"/>
  <circle cx="700" cy="300" r="55" fill="#ffffff" opacity="0.08"/>

  <!-- SPC 控制图面板 -->
  <g transform="translate(120,85)">
    <rect x="0" y="0" width="560" height="205" rx="16" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35"/>
    <!-- UCL / CL / LCL -->
    <line x1="38" y1="42" x2="530" y2="42" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.75"/>
    <line x1="38" y1="102" x2="530" y2="102" stroke="#ffffff" stroke-width="2.5" opacity="0.55"/>
    <line x1="38" y1="162" x2="530" y2="162" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.75"/>
    <text x="540" y="46" font-family="sans-serif" font-size="15" fill="#ffffff" opacity="0.8" text-anchor="end" transform="translate(-6,0)">UCL</text>
    <text x="540" y="106" font-family="sans-serif" font-size="15" fill="#ffffff" opacity="0.8" text-anchor="end" transform="translate(-6,0)">CL</text>
    <text x="540" y="166" font-family="sans-serif" font-size="15" fill="#ffffff" opacity="0.8" text-anchor="end" transform="translate(-6,0)">LCL</text>
    <!-- 数据点折线 -->
    <polyline points="55,95 105,88 155,99 205,84 255,93 305,80 355,90 405,28 455,86 505,92"
      fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
    <g fill="#ffffff">
      <circle cx="55" cy="95" r="6"/><circle cx="105" cy="88" r="6"/><circle cx="155" cy="99" r="6"/>
      <circle cx="205" cy="84" r="6"/><circle cx="255" cy="93" r="6"/><circle cx="305" cy="80" r="6"/>
      <circle cx="355" cy="90" r="6"/><circle cx="455" cy="86" r="6"/><circle cx="505" cy="92" r="6"/>
    </g>
    <!-- 超限点告警 -->
    <circle cx="405" cy="28" r="13" fill="#ffffff"/>
    <circle cx="405" cy="28" r="13" fill="none" stroke="#7F1D1D" stroke-width="3"/>
    <path d="M400,24 l10,8 M410,24 l-10,8" stroke="#7F1D1D" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.95">生产质量数据分析 · SPC 监控</text>
</svg>
