  <text x="400" y="330" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#ffffff" opacity="0.95">工程项目管理数字化 · CPM 关键路径</text>
